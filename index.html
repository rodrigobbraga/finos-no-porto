<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finos no Porto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
    header{padding:16px;background:#fff;border-bottom:1px solid #ddd}
    header h1{margin:0;font-size:24px}
    header p{margin:6px 0 0;color:#666;font-size:14px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#fff;border-bottom:1px solid #ddd}
    .filter-group{display:flex;flex-direction:column;gap:4px}
    .filter-group label{font-size:12px;color:#666}
    .filter-group input,.filter-group select,.reset-button{height:38px;border:1px solid #ccc;border-radius:8px;padding:0 10px;background:#fff;font-size:14px}
    .filter-group input{width:130px}
    .filter-group select{min-width:160px}
    .reset-button{margin-top:auto;cursor:pointer}
    .reset-button:hover{background:#f2f2f2}
    #map{width:100%;height:calc(100vh - 191px)}
    .status{padding:9px 16px;background:#fff3cd;color:#664d03;font-size:14px;border-bottom:1px solid #ddd}
    .status.error{background:#f8d7da;color:#842029}
    .hidden{display:none}
    .leaflet-popup-content-wrapper{border-radius:14px;padding:0;box-shadow:0 8px 30px rgba(0,0,0,.18)}
    .leaflet-popup-content{margin:0;width:280px!important}
    .leaflet-popup-tip{box-shadow:none}
    .popup-card{padding:18px}
    .popup-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
    .popup-title{font-size:18px;font-weight:700;line-height:1.2;color:#222}
    .popup-price{font-size:22px;font-weight:800;line-height:1;color:#222;white-space:nowrap}
    .popup-main{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:10px;background:#f6f6f6;margin-bottom:12px}
    .popup-main span{font-size:14px;color:#444}
    .popup-main strong{font-size:14px;color:#222}
    .popup-row{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
    .popup-icon{width:18px;flex:0 0 18px;text-align:center;font-size:14px}
    .popup-text{font-size:13px;line-height:1.4;color:#555}
    .popup-updated{margin-top:13px;padding-top:11px;border-top:1px solid #eee;font-size:12px;color:#888}
    .price-marker{display:flex;align-items:center;justify-content:center;min-width:58px;height:34px;padding:0 10px;border-radius:18px;background:#fff;border:2px solid #222;box-shadow:0 3px 10px rgba(0,0,0,.2);font-size:14px;font-weight:800;color:#222;white-space:nowrap}
    .price-marker:after{content:'';position:absolute;bottom:-7px;left:50%;width:12px;height:12px;background:#fff;border-right:2px solid #222;border-bottom:2px solid #222;transform:translateX(-50%) rotate(45deg)}
    @media(max-width:600px){
      header{padding:14px}
      header h1{font-size:21px}
      .filters{padding:10px}
      .filter-group{flex:1;min-width:140px}
      .filter-group input,.filter-group select{width:100%}
      .reset-button{width:100%;margin-top:4px}
      #map{height:calc(100vh - 248px)}
      .leaflet-popup-content{width:270px!important}
      .price-marker{min-width:54px;height:32px;font-size:13px}
    }
  </style>
</head>
<body>
  <header>
    <h1>Finos no Porto</h1>
    <p>Encontra e compara finos no Porto</p>
  </header>

  <div class="filters">
    <div class="filter-group">
      <label for="precoMax">Preço máximo</label>
      <input id="precoMax" type="number" min="0" step="0.10" placeholder="Ex.: 1,50">
    </div>
    <div class="filter-group">
      <label for="zona">Zona</label>
      <select id="zona">
        <option value="">Todas as zonas</option>
      </select>
    </div>
    <button id="limparFiltros" class="reset-button" type="button">Limpar filtros</button>
  </div>

  <div id="status" class="status">A carregar os bares...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbwFt-7PYWvu8S5S129T_YDVPxcBwnCCQM3oueH1dddZmvgZJTJdo_T1dX-5w60wzwahCQ/exec';
    const map=L.map('map').setView([41.1579,-8.6291],13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);

    const statusElement=document.getElementById('status');
    const precoMaxElement=document.getElementById('precoMax');
    const zonaElement=document.getElementById('zona');
    const limparFiltrosElement=document.getElementById('limparFiltros');

    let todosOsBares=[];
    let markersLayer=L.layerGroup().addTo(map);

    function escapeHtml(value){
      if(value===null||value===undefined)return '';
      return String(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function formatPrice(price){
      const number=Number(price);
      if(!Number.isFinite(number))return 'Preço não disponível';
      return number.toLocaleString('pt-PT',{
        style:'currency',
        currency:'EUR'
      });
    }

    function formatPricePerLiter(price){
      const number=Number(price);
      if(!Number.isFinite(number))return '';
      return number.toLocaleString('pt-PT',{
        style:'currency',
        currency:'EUR'
      })+'/L';
    }

    function daysSince(dateValue){
      if(!dateValue)return null;
      const date=new Date(dateValue);
      if(Number.isNaN(date.getTime()))return null;
      const now=new Date();
      return Math.floor((now.getTime()-date.getTime())/(1000*60*60*24));
    }

    function formatUpdatedText(dateValue){
      const days=daysSince(dateValue);
      if(days===null)return 'Data de atualização desconhecida';
      if(days<0)return 'Atualização futura';
      if(days===0)return 'Atualizado hoje';
      if(days===1)return 'Atualizado há 1 dia';
      return `Atualizado há ${days} dias`;
    }

    function createPriceIcon(price){
      const number=Number(price);
      const text=Number.isFinite(number)
        ? number.toLocaleString('pt-PT',{
            style:'currency',
            currency:'EUR',
            minimumFractionDigits:2
          })
        : '—';

      return L.divIcon({
        className:'',
        html:`<div class="price-marker">${text}</div>`,
        iconSize:[58,42],
        iconAnchor:[29,42],
        popupAnchor:[0,-42]
      });
    }

    function createPopupContent(bar){
      const nome=escapeHtml(bar.nome);
      const marca=escapeHtml(bar.marca_cerveja);
      const morada=escapeHtml(bar.morada);
      const freguesia=escapeHtml(bar.freguesia);
      const zona=escapeHtml(bar.zona);
      const preco=formatPrice(bar.preco_fino);
      const tamanho=Number(bar.tamanho_cl);
      const precoLitro=formatPricePerLiter(bar.preco_litro);
      const atualizado=formatUpdatedText(bar.atualizado_em);

      return `
        <div class="popup-card">
          <div class="popup-header">
            <div class="popup-title">${nome}</div>
            <div class="popup-price">${preco}</div>
          </div>
          <div class="popup-main">
            <span>${tamanho} cl</span>
            <span>·</span>
            <strong>${marca}</strong>
          </div>
          <div class="popup-row">
            <div class="popup-icon">€/L</div>
            <div class="popup-text"><strong>${precoLitro}</strong></div>
          </div>
          <div class="popup-row">
            <div class="popup-icon">⌖</div>
            <div class="popup-text">${morada}</div>
          </div>
          <div class="popup-row">
            <div class="popup-icon">●</div>
            <div class="popup-text">${freguesia} · ${zona}</div>
          </div>
          <div class="popup-updated">${atualizado}</div>
        </div>
      `;
    }

    function preencherZonas(){
      const zonas=[...new Set(
        todosOsBares
          .map(bar=>String(bar.zona||'').trim())
          .filter(Boolean)
      )].sort((a,b)=>a.localeCompare(b,'pt'));

      zonaElement.innerHTML='<option value="">Todas as zonas</option>';

      zonas.forEach(zona=>{
        const option=document.createElement('option');
        option.value=zona;
        option.textContent=zona;
        zonaElement.appendChild(option);
      });
    }

    function obterBaresFiltrados(){
      const precoMaxTexto=precoMaxElement.value.replace(',','.');
      const precoMax=precoMaxTexto===''?null:Number(precoMaxTexto);
      const zonaSelecionada=zonaElement.value;

      return todosOsBares.filter(bar=>{
        const preco=Number(bar.preco_fino);

        if(precoMax!==null&&Number.isFinite(precoMax)){
          if(!Number.isFinite(preco)||preco>precoMax)return false;
        }

        if(zonaSelecionada&&String(bar.zona)!==zonaSelecionada){
          return false;
        }

        return true;
      });
    }

    function mostrarBares(){
      markersLayer.clearLayers();

      const baresFiltrados=obterBaresFiltrados();
      const markers=[];

      baresFiltrados.forEach(bar=>{
        const latitude=Number(bar.latitude);
        const longitude=Number(bar.longitude);

        if(!Number.isFinite(latitude)||!Number.isFinite(longitude))return;

        const marker=L.marker(
          [latitude,longitude],
          {icon:createPriceIcon(bar.preco_fino)}
        );

        marker.bindPopup(createPopupContent(bar));
        marker.addTo(markersLayer);
        markers.push(marker);
      });

      if(markers.length>0){
        const group=L.featureGroup(markers);
        map.fitBounds(group.getBounds(),{
          padding:[40,40],
          maxZoom:15
        });
      }else{
        map.setView([41.1579,-8.6291],13);
      }

      statusElement.classList.remove('error','hidden');
      statusElement.textContent=baresFiltrados.length===1
        ?'1 bar encontrado'
        :`${baresFiltrados.length} bares encontrados`;

      setTimeout(()=>{
        statusElement.classList.add('hidden');
      },1500);
    }

    async function carregarBares(){
      try{
        statusElement.classList.remove('error','hidden');
        statusElement.textContent='A carregar os bares...';

        const response=await fetch(API_URL);

        if(!response.ok){
          throw new Error(`Erro HTTP ${response.status}`);
        }

        const data=await response.json();

        if(!data.sucesso){
          throw new Error(data.erro||'A API devolveu um erro.');
        }

        if(!Array.isArray(data.bares)){
          throw new Error('A resposta da API não contém uma lista de bares.');
        }

        todosOsBares=data.bares;
        preencherZonas();
        mostrarBares();

        console.log('Dados recebidos da API:',data);
      }catch(error){
        console.error('Erro ao carregar os bares:',error);
        statusElement.classList.remove('hidden');
        statusElement.classList.add('error');
        statusElement.textContent='Não foi possível carregar os bares. Verifica a ligação à API.';
      }
    }

    precoMaxElement.addEventListener('input',mostrarBares);
    zonaElement.addEventListener('change',mostrarBares);

    limparFiltrosElement.addEventListener('click',()=>{
      precoMaxElement.value='';
      zonaElement.value='';
      mostrarBares();
    });

    carregarBares();
  </script>
</body>
</html>
