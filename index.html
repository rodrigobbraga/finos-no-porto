<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finos no Porto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5}
    header{padding:16px;background:#fff;border-bottom:1px solid #ddd}
    header h1{margin:0;font-size:24px}
    header p{margin:6px 0 0;color:#666;font-size:14px}
    #map{width:100%;height:calc(100vh - 89px)}
    .popup-title{font-weight:bold;font-size:17px;margin-bottom:8px}
    .popup-price{font-size:20px;font-weight:bold;margin-bottom:5px}
    .popup-info{color:#555;font-size:14px;margin-bottom:4px}
    .popup-updated{color:#777;font-size:12px;margin-top:8px}
    .status{padding:10px 16px;background:#fff3cd;color:#664d03;font-size:14px;border-bottom:1px solid #ddd}
    .status.error{background:#f8d7da;color:#842029}
    .hidden{display:none}
  </style>
</head>
<body>
  <header>
    <h1>Finos no Porto</h1>
    <p>Encontra e compara finos no Porto</p>
  </header>
  <div id="status" class="status">A carregar os bares...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbwFt-7PYWvu8S5S129T_YDVPxcBwnCCQM3oueH1dddZmvgZJTJdo_T1dX-5w60wzwahCQ/exec';
    const map=L.map('map').setView([41.1579,-8.6291],13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);

    const statusElement=document.getElementById('status');

    function escapeHtml(value){
      if(value===null||value===undefined)return '';
      return String(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function formatPrice(price){
      const number=Number(price);
      if(!Number.isFinite(number))return 'Preço não disponível';
      return number.toLocaleString('pt-PT',{
        style:'currency',
        currency:'EUR'
      });
    }

    function formatPricePerLiter(price){
      const number=Number(price);
      if(!Number.isFinite(number))return '';
      return number.toLocaleString('pt-PT',{
        style:'currency',
        currency:'EUR'
      })+'/L';
    }

    function daysSince(dateValue){
      if(!dateValue)return null;
      const date=new Date(dateValue);
      if(Number.isNaN(date.getTime()))return null;
      const now=new Date();
      return Math.floor((now.getTime()-date.getTime())/(1000*60*60*24));
    }

    function formatUpdatedText(dateValue){
      const days=daysSince(dateValue);
      if(days===null)return 'Data de atualização desconhecida';
      if(days<0)return 'Atualização futura';
      if(days===0)return 'Atualizado hoje';
      if(days===1)return 'Atualizado há 1 dia';
      return `Atualizado há ${days} dias`;
    }

    function createPopupContent(bar){
      const nome=escapeHtml(bar.nome);
      const marca=escapeHtml(bar.marca_cerveja);
      const morada=escapeHtml(bar.morada);
      const freguesia=escapeHtml(bar.freguesia);
      const zona=escapeHtml(bar.zona);
      const preco=formatPrice(bar.preco_fino);
      const tamanho=Number(bar.tamanho_cl);
      const precoLitro=formatPricePerLiter(bar.preco_litro);
      const atualizado=formatUpdatedText(bar.atualizado_em);

      return `
        <div class="popup">
          <div class="popup-title">${nome}</div>
          <div class="popup-price">${preco}</div>
          <div class="popup-info">${tamanho} cl · ${marca}</div>
          <div class="popup-info">${precoLitro}</div>
          <div class="popup-info">${morada}</div>
          <div class="popup-info">${freguesia} · ${zona}</div>
          <div class="popup-updated">${atualizado}</div>
        </div>
      `;
    }

    async function carregarBares(){
      try{
        statusElement.classList.remove('error','hidden');
        statusElement.textContent='A carregar os bares...';

        const response=await fetch(API_URL);
        if(!response.ok)throw new Error(`Erro HTTP ${response.status}`);

        const data=await response.json();
        if(!data.sucesso)throw new Error(data.erro||'A API devolveu um erro.');
        if(!Array.isArray(data.bares))throw new Error('A resposta da API não contém uma lista de bares.');

        const markers=[];
        let baresValidos=0;

        data.bares.forEach(bar=>{
          const latitude=Number(bar.latitude);
          const longitude=Number(bar.longitude);

          if(!Number.isFinite(latitude)||!Number.isFinite(longitude)){
            console.warn('Bar ignorado por coordenadas inválidas:',bar);
            return;
          }

          const marker=L.marker([latitude,longitude]).addTo(map);
          marker.bindPopup(createPopupContent(bar));
          markers.push(marker);
          baresValidos++;
        });

        if(markers.length>0){
          const group=L.featureGroup(markers);
          map.fitBounds(group.getBounds(),{
            padding:[40,40],
            maxZoom:15
          });
        }

        statusElement.textContent=`${baresValidos} bares carregados`;

        if(baresValidos>0){
          setTimeout(()=>{
            statusElement.classList.add('hidden');
          },2000);
        }

        console.log('Dados recebidos da API:',data);
      }catch(error){
        console.error('Erro ao carregar os bares:',error);
        statusElement.classList.add('error');
        statusElement.textContent='Não foi possível carregar os bares. Verifica a ligação à API.';
      }
    }

    carregarBares();
  </script>
</body>
</html>
