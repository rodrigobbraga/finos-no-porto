<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finos no Porto</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:#222}body{display:flex;flex-direction:column}
header{padding:14px 16px 10px;border-bottom:1px solid #eee;background:#fff;z-index:1000}
header h1{margin:0;font-size:22px}header p{margin:3px 0 0;color:#666;font-size:13px}
#controls{background:#fff;border-bottom:1px solid #eee;padding:8px 12px;z-index:999}
#toggle-filters{border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
#filters{display:none;gap:8px;align-items:end;padding-top:8px;flex-wrap:wrap}
.filter-group{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#555}
.filter-group input,.filter-group select{height:36px;border:1px solid #ddd;border-radius:8px;padding:0 9px;background:#fff}
#clear-filters{height:36px;border:1px solid #ddd;background:#f7f7f7;border-radius:8px;padding:0 12px;cursor:pointer}
#status{font-size:12px;color:#777;margin:8px 2px 0}
#map{flex:1;min-height:0}
.popup{width:260px}.popup-title{font-weight:bold;font-size:17px;margin-bottom:8px}.popup-price{font-size:20px;font-weight:bold;margin-bottom:5px}.popup-info{color:#555;font-size:14px;margin-bottom:4px}.popup-updated{color:#777;font-size:12px;margin-top:8px}.popup-map-link{display:block;margin-top:12px;padding-top:12px;border-top:1px solid #eee;color:#1a73e8;font-size:13px;font-weight:600;text-decoration:none}
.feedback{margin-top:14px;padding-top:12px;border-top:1px solid #eee}.feedback-title{font-size:13px;font-weight:600;margin-bottom:8px}.feedback-form{display:flex;flex-direction:column;gap:7px}.feedback-form input,.feedback-form select{width:100%;height:36px;border:1px solid #ddd;border-radius:7px;padding:0 9px;font-size:13px;background:#fff}.feedback-form button{height:36px;border:0;border-radius:7px;background:#222;color:#fff;font-weight:600;cursor:pointer}.feedback-status{font-size:12px;color:#444;margin-top:7px}
.price-marker{position:relative;width:58px;height:72px}.blue-pin{position:absolute;left:17px;top:20px;width:25px;height:41px}.price-label{position:absolute;left:0;top:0;min-width:58px;background:#fff;border:1px solid #ddd;border-radius:7px;padding:3px 5px;text-align:center;font-size:11px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
@media(max-width:600px){header h1{font-size:20px}#filters{display:none}.popup{width:calc(100vw - 70px);max-width:245px}.popup-title{font-size:16px}.popup-price{font-size:18px}.popup-info{font-size:13px}}
</style>
</head>
<body>
<header><h1>Finos no Porto</h1><p>Encontra e compara finos no Porto</p></header>
<div id="controls">
<button id="toggle-filters" onclick="toggleFiltros()">Filtros</button>
<div id="filters">
<div class="filter-group"><label for="max-price">Preço máximo</label><input id="max-price" type="number" min="0" step="0.01" placeholder="Ex.: 1.50"></div>
<div class="filter-group"><label for="zone-filter">Zona</label><select id="zone-filter"><option value="">Todas as zonas</option></select></div>
<button id="clear-filters" onclick="limparFiltros()">Limpar filtros</button>
</div>
<div id="status">A carregar...</div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyHQkcPVCpXyEhPKALGftxIbviZwqGjCckN-oj8Oz5F65iAmNNHeZYWhUwjXxaDD9uTyQ/exec';
const map=L.map('map',{zoomControl:true}).setView([41.1579,-8.6291],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
let bares=[];let markers=[];

function normalizarPreco(v){const n=Number(String(v??'').replace(',','.').replace('€','').trim());return Number.isFinite(n)&&n>0?Math.round(n*100)/100:null}
function formatPrice(v){const n=normalizarPreco(v);return n===null?'Preço por confirmar':n.toFixed(2).replace('.',',')+' €'}
function formatEuro(v){const n=normalizarPreco(v);return n===null?'—':n.toFixed(2).replace('.',',')+' €'}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function createPriceIcon(price){
  const p=normalizarPreco(price);
  if(p===null)return L.divIcon({className:'',html:'<div class="price-marker"><img class="blue-pin" src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png"></div>',iconSize:[58,72],iconAnchor:[29,72],popupAnchor:[0,-68]});
  return L.divIcon({className:'',html:'<div class="price-marker"><div class="price-label">'+formatEuro(p)+'</div><img class="blue-pin" src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png"></div>',iconSize:[58,72],iconAnchor:[29,72],popupAnchor:[0,-68]});
}
function createPopupContent(bar){
  const id=escapeHtml(bar.bar_id);
  const nome=escapeHtml(bar.nome||'Estabelecimento');
  const preco=normalizarPreco(bar.preco_fino);
  const marca=escapeHtml(bar.marca_cerveja||'Marca por confirmar');
  const zona=escapeHtml(bar.zona||'Zona não indicada');
  const morada=escapeHtml(bar.morada||'Morada não indicada');
  const updated=bar.atualizado_em?escapeHtml(bar.atualizado_em):'Ainda não confirmado';
  let maps='';
  if(bar.google_place_id){
    const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(bar.nome||'Porto')+'&query_place_id='+encodeURIComponent(bar.google_place_id);
    maps='<a class="popup-map-link" href="'+url+'" target="_blank" rel="noopener">Ver no Google Maps →</a>';
  }
  return '<div class="popup">'+
    '<div class="popup-title">'+nome+'</div>'+
    '<div class="popup-price">'+(preco===null?'Preço por confirmar':formatEuro(preco))+'</div>'+
    '<div class="popup-info">20 cl · '+marca+'</div>'+
    '<div class="popup-info">'+morada+'</div>'+
    '<div class="popup-info">'+zona+'</div>'+
    (preco!==null?'<div class="popup-info">Preço/litro: '+formatEuro(preco/0.20)+'</div>':'')+
    '<div class="popup-updated">'+(preco!==null?'Atualizado: '+updated:'Preço ainda por confirmar')+'</div>'+
    maps+
    '<div class="feedback"><div class="feedback-title">Sabes o preço deste fino?</div>'+
    '<form class="feedback-form" data-bar-id="'+id+'">'+
    '<input name="preco" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Preço (€)" required>'+
    '<select name="marca" required><option value="">Marca da cerveja</option><option value="Super Bock">Super Bock</option><option value="Sagres">Sagres</option><option value="Outra">Outra</option></select>'+
    '<button type="submit">Enviar</button>'+
    '<div class="feedback-status"></div></form></div>'+
    '</div>';
}
function configurarFeedback(){
  document.querySelectorAll('.feedback-form').forEach(form=>{
    if(form.dataset.ready)return;
    form.dataset.ready='1';
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const status=form.querySelector('.feedback-status');
      const button=form.querySelector('button');
      const preco=form.querySelector('[name="preco"]').value;
      const marca=form.querySelector('[name="marca"]').value;
      const barId=form.dataset.barId;
      if(!preco||!marca){status.textContent='Preenche o preço e a marca.';return}
      button.disabled=true;
      status.textContent='A enviar...';
      try{
        await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({bar_id:barId,preco_reportado:preco,marca_reportada:marca})});
        status.textContent='✓ Obrigado pela ajuda!';
        setTimeout(()=>map.closePopup(),2000);
      }catch(err){
        status.textContent='Não foi possível enviar. Tenta novamente.';
        button.disabled=false;
      }
    });
  });
}
function mostrarBares(){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  const max=parseFloat(document.getElementById('max-price').value);
  const zona=document.getElementById('zone-filter').value;
  let count=0;
  const bounds=[];
  bares.forEach(bar=>{
    const lat=Number(bar.latitude),lng=Number(bar.longitude);
    if(!Number.isFinite(lat)||!Number.isFinite(lng))return;
    const preco=normalizarPreco(bar.preco_fino);
    if(Number.isFinite(max)&&(preco===null||preco>max))return;
    if(zona&&String(bar.zona||'')!==zona)return;
    const marker=L.marker([lat,lng],{icon:createPriceIcon(preco)}).addTo(map);
    marker.bindPopup(createPopupContent(bar),{maxWidth:300});
    marker.on('popupopen',configurarFeedback);
    markers.push(marker);count++;bounds.push([lat,lng]);
  });
  document.getElementById('status').textContent=count+' bares encontrados';
  if(bounds.length&&!window._mapFitted){map.fitBounds(bounds,{padding:[30,30],maxZoom:14});window._mapFitted=true}
}
function preencherZonas(){
  const select=document.getElementById('zone-filter');
  const zonas=[...new Set(bares.map(b=>String(b.zona||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
  zonas.forEach(z=>{const o=document.createElement('option');o.value=z;o.textContent=z;select.appendChild(o)});
}
function toggleFiltros(){
  const box=document.getElementById('filters');const btn=document.getElementById('toggle-filters');const aberto=box.style.display==='flex';
  box.style.display=aberto?'none':'flex';btn.textContent=aberto?'Filtros':'Fechar filtros';
}
function limparFiltros(){
  document.getElementById('max-price').value='';
  document.getElementById('zone-filter').value='';
  mostrarBares();
}
document.getElementById('max-price').addEventListener('input',mostrarBares);
document.getElementById('zone-filter').addEventListener('change',mostrarBares);

fetch(API_URL)
  .then(r=>r.json())
  .then(data=>{
    bares=Array.isArray(data)?data:[];
    preencherZonas();
    mostrarBares();
  })
  .catch(()=>{
    document.getElementById('status').textContent='Não foi possível carregar os bares.';
  });
</script>
</body>
</html>
